<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Aiuta Lupi a trovare una sorpresa</title>
<meta name="theme-color" content="#f7c6a0">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#f7c6a0;touch-action:none;user-select:none;-webkit-user-select:none;
    font-family:'Fredoka','Trebuchet MS','Segoe UI',Arial,sans-serif}
  canvas{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block}

  #hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    width:min(88vw,360px);z-index:5;pointer-events:none;opacity:0;
    transition:top 1.2s cubic-bezier(.4,0,.2,1),transform 1.2s cubic-bezier(.4,0,.2,1),opacity .6s}
  #hud.show{opacity:1}
  #hud.win{top:50%;transform:translate(-50%,-50%) scale(1.18)}
  #card{position:relative;background:#fff7e8;border:2px solid #e9c89a;border-radius:16px;
    padding:clamp(10px,2.6vmin,18px) 12px;text-align:center;color:#7a3b2e;line-height:1.25;
    box-shadow:0 6px 22px rgba(120,60,30,.28)}
  #card .l1{font-size:clamp(17px,4.6vmin,24px);font-weight:600}
  #card .l2{font-size:clamp(14px,3.8vmin,18px);margin-top:3px}
  #card .l3{font-size:clamp(17px,4.6vmin,22px);font-weight:600;color:#c8483b}
  #tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);
    border-radius:14px;overflow:hidden}
  .tile{background:linear-gradient(135deg,#f4ab62,#e07a45);display:flex;align-items:center;justify-content:center;
    font-size:clamp(14px,3.8vmin,22px);border:1px solid rgba(255,255,255,.35);
    transition:opacity 1s ease,transform 1s ease,filter 1s ease}
  .tile.gone{opacity:0;transform:translateY(16px) scale(.55);filter:blur(7px)}
  #diyas{display:flex;justify-content:center;gap:clamp(8px,3vmin,18px);margin-top:6px}
  .d{font-size:clamp(18px,5vmin,28px);filter:grayscale(1) brightness(.8);opacity:.55;transition:all .7s}
  .d.lit{filter:drop-shadow(0 0 6px #ffb347) drop-shadow(0 0 13px #ff9a2e);opacity:1;animation:fl 1.3s infinite alternate}
  @keyframes fl{from{transform:scale(1)}to{transform:scale(1.13) rotate(3deg)}}

  #mute{position:fixed;top:max(10px,env(safe-area-inset-top));right:10px;z-index:20;width:42px;height:42px;border-radius:50%;
    border:none;background:rgba(255,247,232,.85);font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}
  #hint{position:fixed;left:0;right:0;bottom:7%;text-align:center;z-index:4;pointer-events:none;color:#fff7e8;
    font-size:clamp(16px,4vmin,22px);text-shadow:0 2px 6px rgba(90,40,20,.6);opacity:0;transition:opacity .6s}
  #hint.show{opacity:1}

  .overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    background:rgba(120,50,30,.22);transition:opacity .6s}
  .overlay.hidden{opacity:0;pointer-events:none}
  .box{background:#fff7e8;border:2px solid #e9c89a;border-radius:24px;padding:22px 20px;text-align:center;width:min(86vw,390px);
    box-shadow:0 10px 36px rgba(100,50,20,.35);color:#7a3b2e}
  .box h1{margin:4px 0 8px;font-size:clamp(24px,6.6vmin,32px);line-height:1.15;font-weight:600}
  .box p{margin:0 0 16px;font-size:clamp(15px,3.8vmin,18px);line-height:1.4}
  .row{font-size:28px;letter-spacing:6px;margin-bottom:6px}
  button.go{font-family:inherit;font-size:clamp(20px,5vmin,24px);font-weight:600;color:#fff;border:none;border-radius:999px;
    padding:10px 34px;background:linear-gradient(135deg,#f08a4b,#d9573c);box-shadow:0 5px 0 #a8402c,0 8px 16px rgba(0,0,0,.25);cursor:pointer}
  button.go:active{transform:translateY(3px);box-shadow:0 2px 0 #a8402c}
  #again{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:12;opacity:0;pointer-events:none;transition:opacity .8s}
  #again.show{opacity:1;pointer-events:auto}
  #mute{top:auto;bottom:max(12px,env(safe-area-inset-bottom))}
  .env{font-size:clamp(34px,10vmin,52px);line-height:1.1}
  .envtxt{font-size:clamp(14px,3.8vmin,18px);color:#7a3b2e;font-weight:500}
  #hud.ready #card,#hud.opened #card{pointer-events:auto;cursor:pointer}
  #hud.ready #card{animation:pop .8s ease-in-out infinite alternate;box-shadow:0 0 0 3px #ffd27a,0 0 26px 8px rgba(255,190,80,.85)}
  @keyframes pop{from{transform:scale(1) rotate(-1.5deg)}to{transform:scale(1.08) rotate(1.5deg)}}
  #openHint{display:none;text-align:center;color:#fff7e8;font-size:clamp(16px,4.2vmin,22px);font-weight:600;
    text-shadow:0 2px 6px rgba(90,40,20,.75);margin-top:4px}
  #hud.ready #openHint{display:block}

  #start{align-items:flex-start;padding-top:max(9vh,36px);background:linear-gradient(to bottom,rgba(122,59,46,.4),rgba(122,59,46,0) 72%)}
  .intro{text-align:center;padding:0 22px;width:min(94vw,540px)}
  .intro .row{font-size:clamp(26px,7vmin,38px);letter-spacing:10px;margin-bottom:6px;filter:drop-shadow(0 0 10px rgba(255,190,80,.95))}
  .intro h1{margin:0 0 22px;color:#fff7e8;font-size:clamp(26px,7vmin,42px);line-height:1.15;font-weight:600;
    text-shadow:0 3px 0 #b8603a,0 8px 22px rgba(90,40,20,.55)}
  .play{width:clamp(72px,18vmin,96px);height:clamp(72px,18vmin,96px);border-radius:50%;border:none;
    background:linear-gradient(135deg,#f6a25b,#e0503f);color:#fff;font-size:clamp(30px,8vmin,42px);padding:0 0 0 6px;
    box-shadow:0 6px 0 #a8402c,0 12px 24px rgba(0,0,0,.28);cursor:pointer;animation:bob 1.4s ease-in-out infinite}
  .play:active{transform:translateY(4px);animation:none}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

  #letterModal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));
    background:rgba(70,30,20,.62);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .5s}
  #letterModal.show{opacity:1;pointer-events:auto}
  .paper{position:relative;width:min(100%,470px);max-height:100%;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;
    background:#fff7e8;border:2px solid #e9c89a;border-radius:20px;padding:22px 16px 18px;text-align:center;color:#7a3b2e;
    box-shadow:0 14px 50px rgba(0,0,0,.4);transform:translateY(30px) scale(.9) rotate(-2deg);
    transition:transform .7s cubic-bezier(.2,1.2,.3,1)}
  #letterModal.show .paper{transform:none}
  .paper .dd{font-size:24px;margin-bottom:6px}
  .paper h2{margin:0 0 6px;font-size:clamp(24px,7vmin,32px);font-weight:600;line-height:1.15}
  #stage{--H:clamp(240px,52vh,460px);position:relative;height:var(--H);margin:10px 0 12px}
  .hearts{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .hearts span{position:absolute;bottom:-14px;left:var(--x);font-size:var(--s);color:#f48fa6;opacity:0;animation:rise 6.5s linear infinite;animation-delay:var(--d)}
  @keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.75}100%{transform:translateY(calc(var(--H) * -1)) translateX(16px);opacity:0}}
  .pola{position:absolute;left:50%;top:50%;margin:0;background:#fff;padding:7px 7px 10px;border-radius:4px;
    box-shadow:0 8px 22px rgba(80,40,20,.38);opacity:0;
    transform:translate(-50%,170%) rotate(calc(var(--r) * 3)) scale(.8);
    transition:transform 1.1s cubic-bezier(.2,1.1,.3,1),opacity .9s ease}
  .pola.l{width:min(78%,calc(var(--H) * 1.2))}
  .pola.p{width:min(54%,calc(var(--H) * .66))}
  .pola.in{opacity:1;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r))}
  .pola img{display:block;width:100%;height:auto;border-radius:2px}
  .paper .sign{opacity:0;transition:opacity 1.4s ease}
  .paper .sign.show{opacity:1}
  .paper .sign{font-size:clamp(18px,5vmin,24px);line-height:1.3}
  .paper .sign b{display:block;font-size:clamp(26px,7.5vmin,34px);color:#c8483b;font-weight:600}
  .paper button.go{margin-top:16px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="card">
    <div class="env">💌</div>
    <div class="envtxt">Una lettera per te</div>
    <div id="tiles"></div>
  </div>
  <div id="diyas"><span class="d">🪔</span><span class="d">🪔</span><span class="d">🪔</span><span class="d">🪔</span><span class="d">🪔</span></div>
  <div id="openHint">Tocca la lettera!</div>
</div>

<button id="mute" aria-label="Suono">🔊</button>
<div id="hint">Tocca lo schermo per saltare</div>

<div id="start" class="overlay">
  <div class="intro">
    <div class="row">🪔 🍂 🪔</div>
    <h1>Aiuta Lupi a scoprire cosa c'è dentro la lettera!</h1>
    <button class="play" id="startBtn" aria-label="Gioca">▶</button>
  </div>
</div>

<div id="letterModal" aria-hidden="true">

    <h2>Buon anniversario Lupi!</h2>

<script>
(() => {
  const TOTAL = 15, DIYAS = 5;
  const G = 2200, JUMP = 780, BASE = 235;
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  const tilesEl = $('tiles'), hud = $('hud'), startEl = $('start'), modal = $('letterModal'), card = $('card'),
        hint = $('hint'), muteBtn = $('mute');
  const diyaEls = [...document.querySelectorAll('.d')];

  /* ---------- tessere della lettera ---------- */
  const tiles = [];
  for (let i = 0; i < TOTAL; i++) {
    const d = document.createElement('div');
    d.className = 'tile';
    d.textContent = i % 2 ? '🍂' : '🍁';
    tilesEl.appendChild(d);
    tiles.push(d);
  }
  let order = [];
  function shuffle() {
    order = [...Array(TOTAL).keys()];
    for (let i = TOTAL - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
  }
  function updateDiyas() {
    const lit = Math.floor(bites * DIYAS / TOTAL);
    diyaEls.forEach((el, i) => el.classList.toggle('lit', i < lit));
  }

  /* ---------- stato ---------- */
  let W = 0, H = 0, dpr = 1, s = 1, groundY = 0;
  let state = 'menu';             // menu | play | win
  let time = 0, last = 0, dist = 0, speed = 0;
  let bites = 0, spawnT = 0, hintT = 0, nextHop = 0;
  let letterReady = false, paused = false;
  const wolf = { x: 90, y: 0, vy: 0, hit: 0, mouth: 0, blinkT: 2 };
  let items = [], obs = [], parts = [], texts = [], leaves = [], confetti = [];
  const OBST = [
    { e: '⛵', w: 40, h: 46, size: 52 },
    { e: '🚢', w: 58, h: 46, size: 56 },
    { t: 'eiffel', w: 40, h: 66 },
    { e: '⚔️', w: 38, h: 46, size: 50 },
    { e: '🦔', w: 34, h: 30, size: 42 },
    { e: '🍄', w: 28, h: 34, size: 40 },
    { e: '🎃', w: 34, h: 34, size: 42 },
    { e: '🐢', w: 34, h: 26, size: 40 }
  ];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    s = Math.max(0.6, Math.min(W / 420, H / 380));
    groundY = H * 0.80;
    if (!leaves.length) {
      for (let i = 0; i < 22; i++) leaves.push(newLeaf(true));
    }
  }
  const LEAFCOL = ['#e8833a', '#d9573c', '#f2b84b', '#c9763f', '#e8a04a'];
  function newLeaf(anywhere) {
    return { x: Math.random() * W, y: anywhere ? Math.random() * H : -12,
      vy: 25 + Math.random() * 30, sw: Math.random() * 6, rot: Math.random() * 6,
      rs: (Math.random() - .5) * 2, size: 6 + Math.random() * 7,
      col: LEAFCOL[Math.floor(Math.random() * LEAFCOL.length)] };
  }
  const viewW = () => W / s;
  const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

  /* ---------- audio ---------- */
  let AC = null, muted = false, musicTimer = null, step = 0;
  function initAudio() {
    if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; return; }
    startMusic();
  }
  function tone(f, d = .12, type = 'sine', v = .12, slide = 0, delay = 0) {
    if (!AC || muted) return;
    const t = AC.currentTime + delay;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + .015);
    g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + d + .03);
  }
  const sfx = {
    jump() { tone(360, .16, 'sine', .08, 320); },
    eat() { tone(620, .09, 'triangle', .16); tone(930, .16, 'triangle', .15, 0, .07); },
    hit() { tone(200, .3, 'sawtooth', .08, -120); },
    win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .5, 'triangle', .14, 0, i * .14)); }
  };
  let distCurve = null;
  function guitar(f, d, v, chord) {
    if (!AC || muted || !distCurve) return;
    const t = AC.currentTime;
    const sh = AC.createWaveShaper(); sh.curve = distCurve;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = chord ? 2400 : 3600;
    const g = AC.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + .008);
    g.gain.exponentialRampToValueAtTime(.0001, t + d);
    sh.connect(lp); lp.connect(g); g.connect(AC.destination);
    (chord ? [f, f * 1.5, f * 2] : [f, f * 1.006, f * 2]).forEach(fr => {
      const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr;
      o.connect(sh); o.start(t); o.stop(t + d + .03);
    });
  }
  const RIFF = [
    [82.4, 82.4, 0, 82.4, 98, 0, 110, 98],
    [82.4, 82.4, 0, 82.4, 98, 0, 123.5, 110],
    [110, 110, 0, 110, 130.8, 0, 146.8, 130.8],
    [98, 98, 0, 98, 110, 0, 123.5, 0]
  ];
  const LEAD = [
    [0, 0, 659, 0, 587, 0, 494, 0],
    [440, 0, 494, 440, 392, 0, 0, 0],
    [0, 0, 659, 0, 659, 587, 0, 494],
    [587, 0, 494, 0, 440, 0, 392, 0]
  ];
  let musicMode = 'rock', rstep = 0, tickN = 0;
  const CHORDS = [[261.6, 329.6, 392, 523.3], [246.9, 293.7, 392, 493.9], [220, 261.6, 329.6, 440], [220, 261.6, 349.2, 440]];
  const BASSN = [130.8, 98, 110, 87.3];
  const ARP = [0, 2, 1, 3, 2, 1, 3, 1];
  const ROMEL = [
    [659, 0, 784, 0, 880, 0, 784, 0],
    [587, 0, 0, 0, 784, 0, 659, 0],
    [659, 0, 880, 0, 784, 0, 659, 0],
    [698, 0, 0, 0, 659, 0, 523, 0]
  ];
  function soft(f, d, v) { tone(f, d, 'triangle', v); tone(f * 2, d * .6, 'sine', v * .25); }
  function romanticStep() {
    const bar = Math.floor(rstep / 8) % 4, i = rstep % 8;
    if (i === 0) tone(BASSN[bar], 1.9, 'triangle', .06);
    soft(CHORDS[bar][ARP[i]], .9, .034);
    const m = ROMEL[bar][i];
    if (m) soft(m, 1.2, .05);
    rstep++;
  }
  function startMusic() {
    if (musicTimer) return;
    const n = 1024; distCurve = new Float32Array(n);
    for (let i = 0; i < n; i++) distCurve[i] = Math.tanh((i * 2 / n - 1) * 7);
    musicTimer = setInterval(() => {
      if (!AC || muted || document.hidden) return;
      if (musicMode === 'romantic') { if (++tickN % 2 === 0) romanticStep(); return; }
      const bar = Math.floor(step / 8) % 4, i = step % 8;
      const r = RIFF[bar][i];
      if (r) { const acc = i === 0 || i === 4; guitar(r, acc ? .2 : .09, acc ? .07 : .055, true); }
      const l = LEAD[bar][i];
      if (l) guitar(l, .26, .035, false);
      step++;
    }, 215);
  }
  muteBtn.addEventListener('click', e => {
    e.stopPropagation();
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    initAudio();
  });

  /* ---------- logica di gioco ---------- */
  function reset() {
    shuffle();
    tiles.forEach(t => t.classList.remove('gone'));
    bites = 0; updateDiyas();
    items = []; obs = []; parts = []; texts = []; confetti = [];
    wolf.y = 0; wolf.vy = 0; wolf.hit = 0; wolf.mouth = 0;
    spawnT = 1.0; speed = BASE;
    hud.classList.remove('win', 'ready', 'opened');
    modal.classList.remove('show');
    letterReady = false; paused = false;
  }
  function startGame() {
    initAudio();
    reset();
    state = 'play';
    hud.classList.add('show');
    startEl.classList.add('hidden');
    hint.classList.add('show'); hintT = 4.5;
  }
  function jump() {
    if (state !== 'play' || wolf.y < 0) return;
    wolf.vy = -JUMP;
    sfx.jump();
  }
  function spawnGroup() {
    const x0 = viewW() + 60;
    const pick = () => ['honey', 'apple', 'cookie'][Math.floor(Math.random() * 3)];
    const mkOb = x => { const o = OBST[Math.floor(Math.random() * OBST.length)]; obs.push({ x, ...o }); };
    const r = Math.random();
    if (r < .2) { mkOb(x0); items.push({ x: x0, y: -105, k: pick() }); return 0; }
    if (r < .35) { items.push({ x: x0, y: -30, k: pick() }); items.push({ x: x0 + 70, y: -30, k: pick() }); return 70; }
    if (r < .5) { items.push({ x: x0, y: -60, k: pick() }); items.push({ x: x0 + 55, y: -105, k: pick() }); items.push({ x: x0 + 110, y: -60, k: pick() }); return 110; }
    if (r < .68) { mkOb(x0); items.push({ x: x0 + 140, y: -30, k: pick() }); return 140; }
    if (r < .86) { mkOb(x0); items.push({ x: x0 + 110, y: -30, k: pick() }); mkOb(x0 + 220); items.push({ x: x0 + 220, y: -105, k: pick() }); return 220; }
    mkOb(x0); mkOb(x0 + 210); mkOb(x0 + 420);
    items.push({ x: x0 + 105, y: -90, k: pick() }); items.push({ x: x0 + 315, y: -90, k: pick() });
    return 420;
  }
  function sparkle(x, y, n, cols) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, v = 60 + Math.random() * 120;
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: .6 + Math.random() * .4,
        r: 2 + Math.random() * 2.5, col: cols[Math.floor(Math.random() * cols.length)] });
    }
  }
  function collect(it) {
    wolf.mouth = .25;

      ctx.font = `600 22px Fredoka,"Trebuchet MS",sans-serif`;
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(120,50,30,.7)'; ctx.strokeText(t.txt, t.x, t.y);
      ctx.fillStyle = '#fff7e8'; ctx.fillText(t.txt, t.x, t.y);
    }
    ctx.globalAlpha = 1;
  }
  function drawScreenFX() {
    for (const l of leaves) {
      ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.rot);
      ctx.fillStyle = l.col; ctx.globalAlpha = .85;
      ctx.beginPath(); ctx.ellipse(0, 0, l.size, l.size * .55, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(90,40,20,.35)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-l.size, 0); ctx.lineTo(l.size, 0); ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    for (const c of confetti) {
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.fillStyle = c.col;
      if (c.heart) {
        ctx.font = `${c.size * 2}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('♥', 0, 0);
      } else {
        ctx.scale(1, Math.abs(Math.sin(time * 4 + c.ph)) * .8 + .2);
        ctx.fillRect(-c.size / 2, -c.size / 4, c.size, c.size / 2);
      }
      ctx.restore();
    }
  }
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    ctx.setTransform(dpr * s, 0, 0, dpr * s, 0, groundY * dpr);
    drawGroundDiyas();
    drawItems();
    drawWolf();
    drawFX();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawScreenFX();
  }

  /* ---------- input ---------- */
  window.addEventListener('pointerdown', e => {
    if (paused || e.target.closest('button, #card, #letterModal')) return;
    if (state === 'play') jump();
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      if (paused) return;
      if (state === 'menu') startGame(); else jump();
    }
  });
  $('startBtn').addEventListener('click', startGame);
  card.addEventListener('click', openLetter);
  $('closeLetter').addEventListener('click', closeLetter);
  modal.addEventListener('click', e => { if (e.target === modal) closeLetter(); });
  window.addEventListener('keydown', e => { if (e.code === 'Escape' && paused) closeLetter(); });
  document.addEventListener('visibilitychange', () => { last = performance.now() / 1000; });
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  document.addEventListener('touchmove', e => { if (!e.target.closest('#letterModal')) e.preventDefault(); }, { passive: false });

  /* ---------- avvio ---------- */
  resize(); shuffle();
  last = performance.now() / 1000;
  function frame(ts) {
    const t = ts / 1000;
    const dt = Math.min(.033, Math.max(0, t - last)); last = t;
    if (!paused) update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
